<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Monster Watch</title>
<style>
  :root{--ink:#f0e6d0;--muted:#9a8b70;--gold:#d4b45a;--blood:#b33}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#07090c;color:var(--ink);font-family:Georgia,serif;overflow:hidden}
  #wrap{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#0d1218;border-bottom:1px solid #2c2618;z-index:3}
  header h1{font-size:16px;letter-spacing:.14em;color:var(--gold);font-weight:400}
  header h1 span{color:var(--muted);font-size:12px;margin-left:10px;letter-spacing:.04em}
  #hud{display:flex;gap:16px;font-size:13px;color:var(--muted)}
  #hud b{color:var(--ink)}
  #stage{flex:1;position:relative}
  canvas{display:block;width:100%;height:100%;cursor:none;background:#0a0e12}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,8,10,.88);z-index:6}
  #overlay.show{display:flex}
  .card{width:min(680px,92vw);background:#141b22;border:1px solid #3a3224;padding:28px 32px}
  .card h2{color:var(--gold);font-weight:400;margin-bottom:8px;letter-spacing:.06em}
  .card p{color:var(--muted);line-height:1.45;margin-bottom:16px}
  .contracts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font-family:inherit;cursor:pointer;border:1px solid #4a3f2a;background:#1c242c;color:var(--ink);padding:10px 12px;text-align:left}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button .t{display:block;color:var(--gold);font-size:14px}
  button .d{display:block;color:var(--muted);font-size:12px;margin-top:3px}
  #ammo{display:flex;gap:6px;padding:8px 12px;background:#0d1218;border-top:1px solid #2c2618;flex-wrap:wrap;align-items:center;z-index:3}
  .ammo{border:1px solid #333;background:#1a2228;color:var(--muted);padding:6px 9px;font-size:12px}
  .ammo.on{border-color:var(--gold);color:var(--ink);background:#24303a}
  .ammo kbd{color:var(--gold);margin-right:4px}
  #hint{margin-left:auto;font-size:12px;color:var(--muted)}
  #log{position:absolute;left:14px;bottom:12px;max-width:380px;font-size:13px;color:var(--ink);text-shadow:0 1px 5px #000;pointer-events:none;z-index:2}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>MONSTER WATCH <span>first watch — human warden</span></h1>
    <div id="hud">
      <div>Village <b id="hp">100</b></div>
      <div>Materials <b id="mat">0</b></div>
      <div>Contracts <b id="won">0</b></div>
    </div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="overlay" class="show"><div class="card" id="menu">
      <h2>Take the watch</h2>
      <p>You are the warden on the wall. A living man with a bow. Study the beast, pick the shot that kills it, and keep the village alive.</p>
      <div class="contracts" id="contracts"></div>
    </div></div>
    <div id="log"></div>
  </div>
  <div id="ammo"></div>
</div>
<script src="game.js"></script>
</body>
</html>
