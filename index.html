<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monster Watch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07090c;color:#f0e6d0;font-family:Georgia,serif;overflow:hidden}
#wrap{display:flex;flex-direction:column;height:100%}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#0d1218;border-bottom:1px solid #2c2618}
h1{font-size:15px;color:#d4b45a;font-weight:400;letter-spacing:.12em}
#hud{display:flex;gap:14px;font-size:13px;color:#9a8b70}#hud b{color:#f0e6d0}
#stage{flex:1;position:relative;min-height:0}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,8,10,.9);z-index:5}
#ov.show{display:flex}
.card{width:min(640px,92vw);background:#141b22;border:1px solid #3a3224;padding:24px}
.card h2{color:#d4b45a;font-weight:400;margin-bottom:8px}
.card p{color:#9a8b70;margin-bottom:14px;line-height:1.4}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font-family:inherit;text-align:left;background:#1c242c;color:#f0e6d0;border:1px solid #4a3f2a;padding:10px;cursor:pointer}
button:hover{border-color:#d4b45a;color:#d4b45a}
button b{display:block;color:#d4b45a}
button i{display:block;font-style:normal;color:#9a8b70;font-size:12px;margin-top:3px}
#bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#0d1218;border-top:1px solid #2c2618;font-size:12px;align-items:center}
.am{border:1px solid #333;background:#1a2228;color:#9a8b70;padding:6px 8px}
.am.on{border-color:#d4b45a;color:#f0e6d0}
#log{position:absolute;left:12px;bottom:10px;max-width:360px;font-size:13px;text-shadow:0 1px 4px #000;pointer-events:none}
</style></head><body>
<div id="wrap">
<header><h1>MONSTER WATCH</h1><div id="hud">Village <b id="hp">100</b> · Materials <b id="mat">0</b> · Done <b id="wn">0</b></div></header>
<div id="stage"><canvas id="c"></canvas>
<div id="ov" class="show"><div class="card" id="menu"><h2>Take the wall</h2><p>You are a human warden. Study the beast, pick the shot, keep the village alive.</p><div class="g" id="cs"></div></div></div>
<div id="log"></div></div>
<div id="bar"></div>
</div>
<script>
const AMMO=[{id:'frost',n:'Frost',k:'1',c:'#7ec8e3'},{id:'flare',n:'Flare',k:'2',c:'#e8a317'},{id:'antidote',n:'Antidote',k:'3',c:'#7cb342'},{id:'rope',n:'Rope',k:'4',c:'#d4a574'},{id:'sonic',n:'Sonic',k:'5',c:'#c084fc'},{id:'ap',n:'A-pierce',k:'6',c:'#b0bec5'},{id:'tranq',n:'Tranq',k:'7',c:'#80cbc4'}];
const B={wyvern:{name:'Ash-Wyvern',weak:'frost',tell:'Wings lock before the dive. Frost the joints.',hp:3,sp:1.1,dmg:22,d:'w'},beetle:{name:'Plate-Beetle',weak:'ap',tell:'Belly plate lifts when it rears. Pierce there.',hp:4,sp:.5,dmg:16,d:'b'},moth:{name:'Blight Moth',weak:'flare',tell:'Light breaks the swarm. Flare it.',hp:2,sp:1.3,dmg:14,d:'m'},stag:{name:'Corrupted Stag',weak:'tranq',tell:'Black drip on the antlers. Dart the neck.',hp:3,sp:.75,dmg:18,d:'s'},wisp:{name:'Hex-Wisp',weak:'sonic',tell:'The core beats. Sound cracks it.',hp:2,sp:1,dmg:20,d:'i'},serpent:{name:'Venom Coil',weak:'antidote',tell:'Fangs wet before the strike. Antidote shaft.',hp:3,sp:.95,dmg:24,d:'e'},roc:{name:'Cliff Roc',weak:'rope',tell:'It hangs at the apex. Bind a wing.',hp:4,sp:.9,dmg:26,d:'r'}};
const C=[{t:'Defend a caravan',d:'Hold the road from the wall.',w:3,k:['wyvern','beetle','serpent']},{t:'Track a beast',d:'One marked monster. You kill it.',w:1,k:['stag','roc','wyvern'],e:1},{t:'Protect a harvest',d:'Night swarm over the fields.',w:4,k:['moth','beetle','wisp']},{t:'Destroy a nest',d:'Brood-mother first.',w:2,k:['serpent','roc','beetle'],e:1}];
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),ov=document.getElementById('ov'),logEl=document.getElementById('log'),bar=document.getElementById('bar');
let dpr=1,state='menu',ammo='frost',hp=100,mat=0,wn=0,con=null,wave=0,beasts=[],arr=[],pt=[],observe=0,obs=0,aim={x:400,y:240},pull=0,kick=0,logs=[],busy=0,cool=0;
function size(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.max(1,r.width*dpr);canvas.height=Math.max(1,r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);
function say(m){logs.unshift(m);logs=logs.slice(0,4);logEl.innerHTML=logs.map(s=>'<div>'+s+'</div>').join('')}
function hud(){document.getElementById('hp').textContent=Math.max(0,Math.ceil(hp));document.getElementById('mat').textContent=mat;document.getElementById('wn').textContent=wn}
function ammoUI(){bar.innerHTML=AMMO.map(a=>'<button class="am '+(a.id===ammo?'on':'')+'" data-id="'+a.id+'">'+a.k+' '+a.n+'</button>').join('')+'<span style="margin-left:auto;color:#9a8b70">Shift = study \u00b7 click = shoot</span>';bar.querySelectorAll('.am').forEach(b=>b.onclick=()=>{ammo=b.dataset.id;ammoUI()})}
function menu(title,body){state='menu';busy=0;ov.classList.add('show');const box=document.getElementById('menu');if(title)box.innerHTML='<h2>'+title+'</h2><p>'+body+'</p><div class="g" id="cs"></div>';const h=document.getElementById('cs');if(!h)return;h.innerHTML=C.map((c,i)=>'<button data-i="'+i+'"><b>'+c.t+'</b><i>'+c.d+'</i></button>').join('');h.querySelectorAll('button').forEach(b=>b.onclick=()=>start(C[+b.dataset.i]))}
function start(c){con=c;wave=0;beasts=[];arr=[];pt=[];observe=0;obs=0;busy=0;hp=100;hud();ov.classList.remove('show');state='play';size();say('You take the wall. '+c.t);spawn()}
function spawn(){wave++;busy=0;beasts=beasts.filter(b=>b.ok);const n=con.e?1:1+Math.min(2,wave-1);const cw=canvas.clientWidth||900,ch=canvas.clientHeight||520;for(let i=0;i<n;i++){const k=con.k[(wave+i-1)%con.k.length],p=B[k];beasts.push(Object.assign({},p,{k,x:cw*.58+Math.random()*cw*.28,y:ch*.30+Math.random()*ch*.28,z:.38+Math.random()*.2,ph:Math.random()*6.28,hp:p.hp+(con.e?2:0),max:p.hp+(con.e?2:0),rev:0,fl:0,ok:1,atk:0}))}say('Incoming: '+beasts.filter(b=>b.ok).map(b=>b.name).join(', '))}
function burst(x,y,c,n){for(let i=0;i<n;i++)pt.push({x,y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,life:.45,c,s:2+Math.random()*3})}
function nearAt(x,y){let best=null,d=1e9;for(const b of beasts){if(!b.ok)continue;const s=30+b.z*72,k=Math.hypot(b.x-x,b.y-y);if(k<d&&k<s){d=k;best=b}}return best}
function shoot(){if(state!=='play'||cool>0)return;cool=.18;pull=1;kick=5;arr.push({x:canvas.clientWidth*.5,y:canvas.clientHeight*.62,tx:aim.x,ty:aim.y,ammo,t:0})}
function hit(b,type){const g=type===b.weak;b.hp-=g?b.max:1;b.fl=.25;burst(b.x,b.y,g?'#d4b45a':'#777',g?20:8);say(g?b.name+' takes the '+type+' in the weak point.':b.name+' eats the shot. Study it.');if(b.hp<=0){b.ok=0;const pay=8+(con.e?12:0)+wave*2;mat+=pay;hud();burst(b.x,b.y,'#6a2020',24);say('It drops. +'+pay+' materials')}}
function lose(){if(state!=='play')return;state='menu';menu('The village burns','You stood the wall and it was not enough. Village restored for the next watch.')}
function win(){if(state!=='play')return;wn++;mat+=20+wave*5;hud();state='menu';menu('Contract complete','People below are alive because you shot. Next watch.')}
function sky(cw,ch){const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#1c2736');g.addColorStop(.5,'#2a2c22');g.addColorStop(1,'#1a1c14');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);ctx.fillStyle='#cfc6a8';ctx.beginPath();ctx.arc(cw*.82,ch*.16,26,0,7);ctx.fill();ctx.fillStyle='#1c2818';ctx.beginPath();ctx.moveTo(0,ch*.58);for(let x=0;x<=cw;x+=30)ctx.lineTo(x,ch*.54+Math.sin(x*.018)*22);ctx.lineTo(cw,ch);ctx.lineTo(0,ch);ctx.fill();ctx.fillStyle='#2a241c';ctx.fillRect(30,ch*.62,18,28);ctx.fillRect(56,ch*.58,22,34);ctx.fillStyle='#3a3428';ctx.fillRect(0,ch*.86,cw,ch);ctx.fillStyle='#222';ctx.fillRect(16,14,120,8);ctx.fillStyle=hp>40?'#4a7a4a':'#9b2c2c';ctx.fillRect(16,14,120*(Math.max(0,hp)/100),8)}
function mon(b){const s=22+b.z*64;ctx.save();ctx.translate(b.x,b.y);ctx.globalAlpha=b.fl>0?.7:Math.min(1,.55+b.z*.5);
if(b.d==='w'){ctx.fillStyle='#6b2e24';ctx.beginPath();ctx.ellipse(0,0,s*.9,s*.35,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-s*.2,0);ctx.quadraticCurveTo(-s*.1,-s*1.1,s*.6,-s*.2);ctx.fill();ctx.fillStyle='#e8dcc4';ctx.beginPath();ctx.arc(s*.8,-s*.12,s*.07,0,7);ctx.fill()}
else if(b.d==='b'){ctx.fillStyle='#2f4a2c';ctx.beginPath();ctx.ellipse(0,0,s*.75,s*.5,0,0,7);ctx.fill();ctx.fillStyle='#c9a44c';ctx.fillRect(-s*.15,-s*.08,s*.35,s*.16)}
else if(b.d==='m'){ctx.fillStyle='#5a3a6a';ctx.beginPath();ctx.ellipse(-s*.15,0,s*.7,s*.45,-.4,0,7);ctx.fill();ctx.fillStyle='#2a1a32';ctx.beginPath();ctx.ellipse(s*.25,0,s*.22,s*.35,0,0,7);ctx.fill()}
else if(b.d==='s'){ctx.fillStyle='#4a3a28';ctx.beginPath();ctx.ellipse(0,s*.1,s*.7,s*.38,0,0,7);ctx.fill();ctx.strokeStyle='#2a2016';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s*.55,-s*.4);ctx.lineTo(s*.35,-s*.95);ctx.moveTo(s*.55,-s*.4);ctx.lineTo(s*.75,-s);ctx.stroke()}
else if(b.d==='i'){const g=ctx.createRadialGradient(0,0,2,0,0,s);g.addColorStop(0,'#d8f0ff');g.addColorStop(1,'rgba(20,40,60,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s,0,7);ctx.fill()}
else if(b.d==='e'){ctx.strokeStyle='#2e6b3a';ctx.lineWidth=s*.28;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-s,s*.2);ctx.bezierCurveTo(-s*.3,-s*.6,s*.2,s*.6,s*.7,0);ctx.stroke();ctx.fillStyle='#c33';ctx.beginPath();ctx.moveTo(s*1.05,-s*.1);ctx.lineTo(s*1.25,0);ctx.lineTo(s*1.05,s*.08);ctx.fill()}
else{ctx.fillStyle='#6a5340';ctx.beginPath();ctx.ellipse(0,0,s*.7,s*.4,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-s*.3,-s*.1);ctx.lineTo(-s*.2,-s);ctx.lineTo(s*.8,-s*.15);ctx.fill()}
ctx.globalAlpha=1;ctx.fillStyle='#222';ctx.fillRect(-s*.6,-s*1.15,s*1.2,5);ctx.fillStyle='#b33';ctx.fillRect(-s*.6,-s*1.15,s*1.2*Math.max(0,b.hp/b.max),5);if(b.rev){ctx.strokeStyle='#d4b45a';ctx.strokeRect(-s*.25,-s*.2,s*.5,s*.4);ctx.fillStyle='#d4b45a';ctx.font='11px Georgia';ctx.fillText(AMMO.find(a=>a.id===b.weak).n,-s*.5,-s*1.28)}ctx.restore()}
function human(cw,ch){const p=pull;ctx.save();ctx.translate(kick?(Math.random()-.5)*kick:0,0);ctx.fillStyle='#2a2218';ctx.beginPath();ctx.moveTo(cw*.18,ch);ctx.quadraticCurveTo(cw*.32,ch*.72,cw*.48,ch*.78);ctx.lineTo(cw*.55,ch);ctx.fill();ctx.fillStyle='#3a2e22';ctx.beginPath();ctx.moveTo(cw*.82,ch);ctx.quadraticCurveTo(cw*.7,ch*.74,cw*.56,ch*.8);ctx.lineTo(cw*.62,ch);ctx.fill();ctx.strokeStyle='#c4a07a';ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cw*.3,ch*.98);ctx.quadraticCurveTo(cw*.28,ch*.78,cw*.42-p*8,ch*.62);ctx.stroke();ctx.fillStyle='#c4a07a';ctx.beginPath();ctx.ellipse(cw*.43-p*8,ch*.6,11,9,0,0,7);ctx.fill();ctx.strokeStyle='#6a4a28';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(cw*.4,ch*.42);ctx.quadraticCurveTo(cw*.52,ch*.58,cw*.41,ch*.78);ctx.stroke();ctx.strokeStyle='#d8c8a8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cw*.4,ch*.42);ctx.lineTo(cw*.36-p*30,ch*.6);ctx.lineTo(cw*.41,ch*.78);ctx.stroke();ctx.strokeStyle='#b8906c';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(cw*.72,ch);ctx.quadraticCurveTo(cw*.68,ch*.8,cw*.36-p*28,ch*.6);ctx.stroke();ctx.fillStyle='#b8906c';ctx.beginPath();ctx.ellipse(cw*.36-p*28,ch*.6,10,8,0,0,7);ctx.fill();ctx.restore();ctx.strokeStyle='rgba(212,180,90,.9)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(aim.x,aim.y,10,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(aim.x-16,aim.y);ctx.lineTo(aim.x-5,aim.y);ctx.moveTo(aim.x+5,aim.y);ctx.lineTo(aim.x+16,aim.y);ctx.moveTo(aim.x,aim.y-16);ctx.lineTo(aim.x,aim.y-5);ctx.moveTo(aim.x,aim.y+5);ctx.lineTo(aim.x,aim.y+16);ctx.stroke()}
function loop(now){const dt=Math.min(.033,(now-(loop.t||now))/1000);loop.t=now;const cw=canvas.clientWidth,ch=canvas.clientHeight;ctx.setTransform(dpr,0,0,dpr,0,0);sky(cw,ch);pull=Math.max(0,pull-dt*3);kick=Math.max(0,kick-dt*18);cool=Math.max(0,cool-dt);
if(state==='play'){if(obs){const n=nearAt(aim.x,aim.y);observe=Math.min(1,observe+dt*(n?1.2:.15));if(n&&observe>=1){n.rev=1;say(n.name+': '+n.tell);observe=0;obs=0}}else observe=Math.max(0,observe-dt*.5);
beasts.forEach(b=>{if(!b.ok)return;b.ph+=dt*b.sp;b.z=Math.min(1.12,b.z+dt*.065*b.sp);b.x+=Math.sin(b.ph*1.3)*16*dt;b.y+=Math.cos(b.ph*.8)*8*dt;b.x=Math.max(cw*.28,Math.min(cw*.92,b.x));b.y=Math.max(ch*.18,Math.min(ch*.62,b.y));b.fl=Math.max(0,b.fl-dt);if(b.z>.96)b.atk+=dt;if(b.atk>1.6){b.atk=0;hp=Math.max(0,hp-b.dmg);kick=12;burst(cw*.5,ch*.55,'#9b2c2c',14);say(b.name+' hits the wall. -'+b.dmg);hud();if(hp<=0)lose()}});
beasts.filter(b=>b.ok).sort((a,c)=>a.z-c.z).forEach(mon);
arr.forEach(a=>{a.t+=dt/.18;const x=a.x+(a.tx-a.x)*Math.min(1,a.t),y=a.y+(a.ty-a.y)*Math.min(1,a.t);ctx.strokeStyle=AMMO.find(z=>z.id===a.ammo).c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-10,y-4);ctx.lineTo(x+8,y+3);ctx.stroke();if(a.t>=1&&!a.hit){a.hit=1;const n=nearAt(a.tx,a.ty);if(n)hit(n,a.ammo);else say('Shaft hits dirt.')}});arr=arr.filter(a=>a.t<1.2);
pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});pt=pt.filter(p=>p.life>0);pt.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);ctx.globalAlpha=1});
if(obs||observe>0){ctx.strokeStyle='rgba(212,180,90,'+(.35+observe*.65)+')';ctx.beginPath();ctx.arc(aim.x,aim.y,22+observe*14,-1.57,-1.57+6.28*observe);ctx.stroke()}
if(!busy&&beasts.length&&beasts.every(b=>!b.ok)){busy=1;if(wave>=con.w)win();else spawn()}}
human(cw,ch);requestAnimationFrame(loop)}
function aimFrom(e){const r=canvas.getBoundingClientRect();const src=e.touches?e.touches[0]:e;aim.x=src.clientX-r.left;aim.y=src.clientY-r.top}
canvas.addEventListener('mousemove',aimFrom);
canvas.addEventListener('mousedown',e=>{if(e.button===0)shoot();if(e.button===2)obs=1});
canvas.addEventListener('mouseup',e=>{if(e.button===2)obs=0});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('touchstart',e=>{e.preventDefault();aimFrom(e);if(e.touches.length>1)obs=1;else shoot()},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();aimFrom(e)},{passive:false});
canvas.addEventListener('touchend',()=>{obs=0});
addEventListener('keydown',e=>{if(e.key==='Shift')obs=1;const a=AMMO.find(x=>x.k===e.key);if(a){ammo=a.id;ammoUI()}});
addEventListener('keyup',e=>{if(e.key==='Shift')obs=0});
size();ammoUI();hud();menu();requestAnimationFrame(loop);
</script></body></html>
